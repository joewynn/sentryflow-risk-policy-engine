site_name: SentryFlow Risk Engine
site_description: Real-time fraud decisioning with ML orchestration and Nacha 2026 compliance
repo_url: https://github.com/joewynn/sentryflow-risk-policy-engine
repo_name: joewynn/sentryflow-risk-policy-engine

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mermaid2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture:
    - Overview: architecture/overview.md
    - API & Orchestration: architecture/api.md
    - ML Models: architecture/models.md
    - Policy Engine: architecture/policies.md
    - DIBB Signals: architecture/dibb.md
  - Compliance:
    - Nacha 2026: compliance/nacha.md
    - Governance & 4-Eyes: compliance/governance.md
    - Decision Audit Trail: compliance/audit-trail.md
  - Development:
    - Running Tests: development/testing.md
    - Active Policy Format: development/policy-format.md
    - Feature Availability: development/feature-registry.md
  - Reference:
    - API Specification: reference/api-spec.md
    - Model Card: reference/model-card.md
    - Threat Models: reference/threat-models.md
  - Business Case:
    - Economic Model: business/economic-model.md
    - Problem Statement: business/problem-statement.md
